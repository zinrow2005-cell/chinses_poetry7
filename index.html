<script id="pkg369-cache-reset">
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister().catch(function(){});});}).catch(function(){});
    }
    if(window.caches){
      caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k).catch(function(){});});}).catch(function(){});
    }
  }catch(e){}
})();
</script>
