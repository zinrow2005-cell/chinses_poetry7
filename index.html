<script id="pkg369-cache-reset">
(function(){
  try{
    if('serviceWorker' in navigator){
      navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(r){r.unregister().catch(function(){});});}).catch(function(){});
    }
    if(window.caches){
      caches.keys().then(function(keys){keys.forEach(function(k){caches.delete(k).catch(function(){});});}).catch(function(){});
    }
  }catch(e){}
})();
</script>

<!-- PKG370｜跨裝置相容 + 全站防誤選取 -->
<style id="pkg370-device-selection-fix-css">
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;max-width:100%;overflow-x:hidden;}
*,*::before,*::after{box-sizing:border-box;}
body{max-width:100%;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
/* 預設整個系統不可反白/全選；真正的輸入欄位仍可正常編輯與選字 */
body,body *:not(input):not(textarea):not(select):not(option):not([contenteditable="true"]){
  -webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;
}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text!important;user-select:text!important;-webkit-touch-callout:default!important;}
img,svg,canvas{-webkit-user-drag:none;user-drag:none;}
button,a,[role="button"],label{touch-action:manipulation;}
button,a,[role="button"]{-webkit-tap-highlight-color:rgba(143,71,16,.14);}
/* 防止任何子項目把頁面撐出視窗 */
.app,.page,.main,.content,.studio,.boardCard,.writeBoard,.sidebar,.library,.side{min-width:0;max-width:100%;}
img,video,canvas{max-width:100%;}
@media(max-width:1100px){
  body.daofaMobileMode{width:100%!important;max-width:100vw!important;height:100dvh!important;min-height:100svh!important;overflow:hidden!important;}
  body.daofaMobileMode .app{width:100%!important;max-width:100vw!important;height:100dvh!important;min-height:100svh!important;overflow:hidden!important;}
  body.daofaMobileMode .main{width:100%!important;max-width:100%!important;min-height:0!important;}
  body.daofaMobileMode .content{min-width:0!important;max-width:100%!important;overflow-x:hidden!important;}
  body.daofaMobileMode .sidebar,body.daofaMobileMode .library{max-width:calc(100vw - 20px)!important;}
}
/* 書寫頁：統一手機 / iPad 的可視高度，避免瀏覽器工具列伸縮造成底部工具被吃掉 */
@media(max-width:900px){
  html,body{width:100%!important;max-width:100%!important;height:100%!important;min-height:100%!important;overflow:hidden!important;}
  body{position:fixed!important;inset:0!important;height:100dvh!important;min-height:100svh!important;}
  .page{width:100%!important;height:100dvh!important;min-height:100svh!important;max-height:100dvh!important;overflow:auto!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;}
  .studio{width:100%!important;max-width:100%!important;min-height:0!important;}
  .boardCard{width:100%!important;max-width:100%!important;min-height:0!important;}
  .writeBoard{width:100%!important;max-width:100%!important;min-width:0!important;}
  #writingCanvas{width:100%!important;max-width:100%!important;-webkit-user-select:none!important;user-select:none!important;-webkit-touch-callout:none!important;}
}
/* iPad 橫向：避免側欄/書寫板被固定寬度擠壓 */
@media(min-width:700px) and (max-width:1100px) and (orientation:landscape){
  .studio{grid-template-columns:minmax(0,1fr)!important;}
  .boardCard{min-width:0!important;}
}
</style>
<script id="pkg370-device-selection-fix-js">
(function(){
  var EDITABLE='input,textarea,select,option,[contenteditable="true"]';
  function editable(target){return !!(target&&target.closest&&target.closest(EDITABLE));}
  function blockSelection(e){if(!editable(e.target)){try{e.preventDefault();}catch(_){}}}
  /* 阻擋滑鼠雙擊、觸控快速連點與拖曳造成的全選；輸入欄位例外 */
  document.addEventListener('selectstart',blockSelection,true);
  document.addEventListener('dragstart',function(e){if(!editable(e.target))e.preventDefault();},true);
  document.addEventListener('dblclick',function(e){
    if(editable(e.target))return;
    try{e.preventDefault();}catch(_){}
    try{var s=window.getSelection&&window.getSelection();if(s&&s.removeAllRanges)s.removeAllRanges();}catch(_){}
  },{capture:true,passive:false});
  document.addEventListener('contextmenu',function(e){
    var board=e.target&&e.target.closest&&e.target.closest('.writeBoard,#writingCanvas');
    if(board&&!editable(e.target))e.preventDefault();
  },{capture:true,passive:false});
  /* Safari 有時會在快速連點後延遲建立 selection，補一次清除 */
  var clearTimer=0;
  document.addEventListener('pointerup',function(e){
    if(editable(e.target))return;
    clearTimeout(clearTimer);
    clearTimer=setTimeout(function(){
      try{var s=window.getSelection&&window.getSelection();if(s&&!s.isCollapsed&&s.removeAllRanges)s.removeAllRanges();}catch(_){}
    },40);
  },true);
  window.addEventListener('pageshow',function(){
    try{document.documentElement.style.setProperty('--pkg370-vh',(window.innerHeight*.01)+'px');}catch(_){}
  });
})();
</script>
